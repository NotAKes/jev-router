name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run explicit offline tests (stdlib only)
        run: python3 -m unittest -v test_jev_router test_benchmark test_benchmark_scoring test_benchmark_extended test_build_windows_release test_setup_opencode_jev test_windows_release_smoke test_router_entrypoint test_jev_gui test_jev_updates
      - name: Check extended synthetic datasets
        run: python3 -m benchmark.extended --check
      - name: Plan benchmark offline
        run: python3 -m benchmark plan
