name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run explicit offline tests (stdlib only)
        run: python3 -m unittest -v test_jev_router test_benchmark test_benchmark_scoring test_benchmark_extended
      - name: Check extended synthetic datasets
        run: python3 -m benchmark.extended --check
      - name: Plan benchmark offline
        run: python3 -m benchmark plan
